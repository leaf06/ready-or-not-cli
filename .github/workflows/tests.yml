name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: Write the smoke-test commands
        shell: bash
        run: printf '1\n1\nlook\nmirror 1\nbreach 1 kick flash\nyell\nmap\nstatus\nend\ny\n' > smoke.txt
      - name: Play a scenario from ron.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call ron.cmd --seed 1 --scenario larkspur_lane --difficulty easy < smoke.txt > smoke.out
          type smoke.out
          findstr /c:"SCORE" smoke.out
      - name: Play a scenario from ./ron
        if: runner.os != 'Windows'
        run: |
          ./ron --seed 1 --scenario larkspur_lane --difficulty easy < smoke.txt | tee smoke.out
          grep -q "SCORE" smoke.out
      - name: Survive a console that can't print every character
        shell: bash
        env:
          PYTHONIOENCODING: ascii
        run: |
          python -m readyornot --seed 1 --scenario larkspur_lane --difficulty easy < smoke.txt | grep -q "SCORE"
